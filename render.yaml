services:
  - type: web
    name: salon-queue-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: node dist/server/server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: CLIENT_ORIGIN
        value: "*"
      - key: STAFF_PIN
        value: "1234"
